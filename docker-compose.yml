services:
  app:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    # shortcut: artisan serve is a dev server, use nginx + php-fpm for production
    command: sh -c "[ -f .env ] || cp .env.example .env; composer install --no-interaction; grep -q '^APP_KEY=.\+' .env || php artisan key:generate; php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

volumes:
  mysql_data:
